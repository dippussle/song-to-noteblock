<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 90px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Convert audio into vanilla Minecraft note block chords</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio file</p>
    <span id="fileSub">MP3, WAV, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="inst">Instrument</label>
      <select id="inst">
        <option value="harp" selected>Harp (Piano)</option>
        <option value="bass">Bass Guitar</option>
        <option value="bell">Bell</option>
        <option value="flute">Flute</option>
        <option value="bit">Bit</option>
        <option value="pling">Pling</option>
      </select>
    </div>
    <div class="field">
      <label for="noteFilter">Note Density</label>
      <select id="noteFilter">
        <option value="clean" selected>Clean (Recommended)</option>
        <option value="all">Full Detail (All notes)</option>
      </select>
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

const MIDI_LO = 54;  // F#3
const MIDI_HI = 78;  // F#5

function foldMidi(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

const INST = { harp:0, bass:1, bass_drum:2, snare:3, hat:4, guitar:5,
               flute:6, bell:7, chime:8, xylophone:9, iron_xylophone:10,
               cow_bell:11, didgeridoo:12, bit:13, banjo:14, pling:15 };

function buildNbsBinary(tickNotes, songName, tps, instName) {
  const tempo = Math.round(tps * 100); // 20 TPS -> 2000
  const instId = INST[instName] ?? 0;

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, new Map([[33, 100]]));
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).size;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS version 5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // 2000 = 20 TPS (1:1 real-time)
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const keyMap = tickNotes.get(tick);
    const sortedKeys = [...keyMap.keys()].sort((a, b) => a - b);
    let layer = 0;
    let prevLayer = -1;
    for (const key of sortedKeys) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(instId);
      u8(key);             // Key 33..57 (Minecraft vanilla 25 notes)
      u8(keyMap.get(key)); // Velocity (0..100)
      u8(100);             // Center panning
      i16(0);              // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  // Layers section
  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  // Custom instruments count (0)
  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

async function runAIConversion(file, opts, log, setProg) {
  log('Decoding audio (22.05 kHz)...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio. Please ensure file is a valid MP3/WAV/OGG/M4A.');
  }

  // Downmix to true Mono AudioBuffer (required by Basic Pitch AI)
  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration.toFixed(1);
  log('Audio loaded: ' + durationSec + 's duration (mono).');
  setProg(15);

  if (!basicPitchInstance) {
    log('Loading AI pitch model...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Running AI Pitch Detection Model...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 65));
    }
  );

  log('Transcribing AI note events & chords...');
  setProg(85);

  const onsetThresh = opts.noteFilter === 'clean' ? 0.55 : 0.4;
  const frameThresh = opts.noteFilter === 'clean' ? 0.35 : 0.25;
  const minNoteLen  = opts.noteFilter === 'clean' ? 6 : 4;

  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    onsetThresh,
    frameThresh,
    minNoteLen,
    true,
    null,
    null,
    true
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  log('AI detected ' + noteEvents.length + ' clean musical note events.');
  setProg(92);

  const tps = 20; // 20 TPS = 1:1 real-time Minecraft speed
  const tickNotes = new Map();
  const uniqueKeys = new Set();
  let maxSimultaneous = 0;

  for (const n of noteEvents) {
    const folded = foldMidi(n.pitchMidi);
    const nbsKey = folded - 21; // 33..57
    const tick = Math.max(0, Math.round(n.startTimeSeconds * tps));
    const vel = Math.round(Math.max(25, Math.min(100, n.amplitude * 100)));

    if (!tickNotes.has(tick)) {
      tickNotes.set(tick, new Map());
    }
    const currentTickMap = tickNotes.get(tick);
    if (!currentTickMap.has(nbsKey) || currentTickMap.get(nbsKey) < vel) {
      currentTickMap.set(nbsKey, vel);
    }
    uniqueKeys.add(nbsKey);
  }

  for (const [t, kmap] of tickNotes) {
    if (kmap.size > maxSimultaneous) maxSimultaneous = kmap.size;
  }

  log('Building .NBS binary at 20 TPS...');
  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(tickNotes, songName, tps, opts.inst);
  setProg(100);
  log('Conversion complete.');

  return {
    bytes,
    stats: {
      notes: noteEvents.length,
      chordMax: maxSimultaneous,
      tps,
      dur: durationSec,
      keys: uniqueKeys.size,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    inst: document.getElementById('inst').value,
    noteFilter: document.getElementById('noteFilter').value,
  };

  try {
    const result = await runAIConversion(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> notes &middot; ' +
      'Up to <strong>' + s.chordMax + ' notes</strong> simultaneous chords<br>' +
      '<strong>' + s.dur + 's</strong> duration &middot; ' +
      '<strong>' + s.keys + '/25</strong> vanilla Minecraft keys used';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
