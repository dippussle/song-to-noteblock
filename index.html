<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 480px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 90px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Convert audio into full 25-note vanilla Minecraft music</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="instMode">Instrument Preset</label>
      <select id="instMode">
        <option value="orchestra" selected>Full Band (Bass + Pling/Guitar + Piano)</option>
        <option value="pling">Pling Guitar (Punchy Lead)</option>
        <option value="harp">Harp (Classic Piano)</option>
        <option value="flute">Flute (Smooth Lead)</option>
      </select>
    </div>
    <div class="field">
      <label for="speedMode">Timing & Speed (TPS)</label>
      <select id="speedMode">
        <option value="20" selected>20 TPS (Original Real-Time 1:1 Speed)</option>
        <option value="10">10 TPS (Redstone Repeater Standard Speed)</option>
      </select>
    </div>
    <div class="field">
      <label for="sensitivity">Melody Sensitivity</label>
      <select id="sensitivity">
        <option value="high" selected>High (Capture full riffs & solos)</option>
        <option value="med">Medium (Balanced)</option>
        <option value="low">Low (Only loudest notes)</option>
      </select>
    </div>
    <div class="field">
      <label for="maxChords">Max Chords per Beat</label>
      <select id="maxChords">
        <option value="4" selected>Up to 4 notes (Melody + Harmony + Bass)</option>
        <option value="2">2 notes (Lead + Bass only)</option>
        <option value="1">1 note (Solo Melody only)</option>
        <option value="25">Unlimited (All detected notes)</option>
      </select>
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v2.1.0</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

// Vanilla Minecraft instrument constants
const NBS_HARP  = 0;  // Dirt (Piano)
const NBS_BASS  = 1;  // Wood (Bass Guitar)
const NBS_FLUTE = 6;  // Clay (Flute)
const NBS_BELL  = 7;  // Gold (Bell)
const NBS_GUITAR = 5; // Wool (Guitar)
const NBS_PLING = 15; // Glowstone (Pling Guitar - best for anime/rock solos)

const MIDI_LO = 54; // F#3
const MIDI_HI = 78; // F#5

function foldToVanillaRange(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

function assignInstrument(originalMidi, mode) {
  if (mode === 'pling') return NBS_PLING;
  if (mode === 'harp') return NBS_HARP;
  if (mode === 'flute') return NBS_FLUTE;

  // 'orchestra' preset:
  if (originalMidi < 48) {
    return NBS_BASS;  // Bass line
  } else if (originalMidi <= 66) {
    return NBS_PLING; // Punchy main lead / guitar
  } else if (originalMidi <= 78) {
    return NBS_HARP;  // Mid-high piano/synth
  } else {
    return NBS_BELL;  // High accents
  }
}

function buildNbsBinary(tickNotes, songName, tps) {
  const tempo = Math.round(tps * 100);

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ inst: 0, key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS v5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // TPS * 100 (e.g. 2000 for 20 TPS, 1000 for 10 TPS)
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(n.inst);        // Instrument ID
      u8(n.key);         // Key (33..57 vanilla 25 notes)
      u8(n.vel);         // Velocity (0..100)
      u8(100);           // Center panning
      i16(0);            // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  // Layers section
  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  // Custom instruments count (0)
  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Full Musical Transcription Pipeline
function transcribeToMinecraft(rawNoteEvents, instMode, maxChordsLimit, tps) {
  const sorted = [...rawNoteEvents].sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);

  const tickMap = new Map(); // tick -> array of notes

  for (const n of sorted) {
    const tick = Math.max(0, Math.round(n.startTimeSeconds * tps));
    const origMidi = Math.round(n.pitchMidi);
    const foldedMidi = foldToVanillaRange(origMidi);
    const nbsKey = foldedMidi - 21; // 33..57

    const inst = assignInstrument(origMidi, instMode);
    const vel = Math.round(Math.max(35, Math.min(100, n.amplitude * 115)));

    if (!tickMap.has(tick)) tickMap.set(tick, []);
    tickMap.get(tick).push({
      inst,
      key: nbsKey,
      vel,
      origMidi,
      amp: n.amplitude,
      dur: n.durationSeconds
    });
  }

  // Select the cleanest, most prominent notes for each tick
  const cleanedTicks = new Map();

  for (const [tick, notes] of tickMap) {
    // Sort by amplitude descending (loudest main notes first)
    notes.sort((a, b) => b.amp - a.amp);

    const chosen = [];
    const usedKeys = new Set();
    const instCounts = new Map();

    for (const n of notes) {
      if (chosen.length >= maxChordsLimit) break;

      const instCnt = instCounts.get(n.inst) || 0;
      if (n.inst === NBS_BASS && instCnt >= 1) continue; // Max 1 bass root note
      if (instCnt >= 3) continue; // Max 3 per instrument

      const keyId = `${n.inst}_${n.key}`;
      if (usedKeys.has(keyId)) continue; // No duplicate on same tick

      chosen.push(n);
      usedKeys.add(keyId);
      instCounts.set(n.inst, instCnt + 1);
    }

    if (chosen.length > 0) {
      cleanedTicks.set(tick, chosen);
    }
  }

  return cleanedTicks;
}

async function runConversion(file, opts, log, setProg) {
  log('Loading ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio. Please ensure file is a valid MP3, WAV, MP4, or OGG.');
  }

  // Downmix to true Mono AudioBuffer
  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration.toFixed(1);
  log('Audio loaded: ' + durationSec + 's.');
  setProg(15);

  if (!basicPitchInstance) {
    log('Loading Spotify AI Pitch Model...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Running AI Transcription...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 65));
    }
  );

  log('Extracting musical notes...');
  setProg(85);

  // Dynamic sensitivity thresholds based on user setting
  let onsetThresh = 0.35;
  let frameThresh = 0.20;
  let minNoteLen  = 3;

  if (opts.sensitivity === 'med') {
    onsetThresh = 0.45;
    frameThresh = 0.28;
    minNoteLen  = 4;
  } else if (opts.sensitivity === 'low') {
    onsetThresh = 0.58;
    frameThresh = 0.38;
    minNoteLen  = 6;
  }

  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    onsetThresh,
    frameThresh,
    minNoteLen,
    true,
    null,
    null,
    true // Melodia trick for extracting the main lead melody
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  log('Transcribed ' + noteEvents.length + ' melodic note events.');
  setProg(92);

  const tps = parseInt(opts.speedMode) || 20;
  const maxChordsLimit = parseInt(opts.maxChords) || 4;

  const orchestratedTicks = transcribeToMinecraft(noteEvents, opts.instMode, maxChordsLimit, tps);

  let totalNotes = 0;
  for (const [t, list] of orchestratedTicks) totalNotes += list.length;

  log('Mapped ' + totalNotes + ' notes onto vanilla Minecraft note blocks at ' + tps + ' TPS.');
  setProg(96);

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(orchestratedTicks, songName, tps);
  setProg(100);
  log('Conversion complete!');

  return {
    bytes,
    stats: {
      notes: totalNotes,
      tps,
      dur: durationSec,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    instMode:    document.getElementById('instMode').value,
    speedMode:   document.getElementById('speedMode').value,
    sensitivity: document.getElementById('sensitivity').value,
    maxChords:   document.getElementById('maxChords').value,
  };

  try {
    const result = await runConversion(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> notes total &middot; ' +
      '<strong>' + s.dur + 's</strong> audio duration<br>' +
      'Playback Grid: <strong>' + s.tps + ' TPS</strong> (Note Block Studio speed)';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
