<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 80px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Minecraft Note Block</h1>
  <p class="subtitle">Convert audio into a 25-note vanilla compatible .nbs file</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio file</p>
    <span id="fileSub">MP3, WAV, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="bpm">BPM (0 = Auto)</label>
      <input type="number" id="bpm" value="0" min="0" max="400">
    </div>
    <div class="field">
      <label for="sens">Sensitivity</label>
      <select id="sens">
        <option value="high">High (more notes)</option>
        <option value="med" selected>Medium</option>
        <option value="low">Low (cleaner)</option>
      </select>
    </div>
    <div class="field">
      <label for="inst">Instrument</label>
      <select id="inst">
        <option value="harp" selected>Harp (Piano)</option>
        <option value="bass">Bass Guitar</option>
        <option value="bell">Bell</option>
        <option value="flute">Flute</option>
        <option value="bit">Bit</option>
        <option value="pling">Pling</option>
      </select>
    </div>
    <div class="field">
      <label for="songName">Song Name</label>
      <input type="text" id="songName" placeholder="Auto">
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<script>
'use strict';

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let b = n >> 1;
    for (; j & b; b >>= 1) j ^= b;
    j ^= b;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < len >> 1; j++) {
        const ur = re[i+j], ui = im[i+j];
        const vr = re[i+j+len/2]*cr - im[i+j+len/2]*ci;
        const vi = re[i+j+len/2]*ci + im[i+j+len/2]*cr;
        re[i+j] = ur+vr; im[i+j] = ui+vi;
        re[i+j+len/2] = ur-vr; im[i+j+len/2] = ui-vi;
        const nr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nr;
      }
    }
  }
}

const FFT_N = 8192;
const HANN = new Float32Array(FFT_N);
for (let i = 0; i < FFT_N; i++) HANN[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FFT_N - 1));

const hzToMidi = hz => 12 * Math.log2(hz / 440) + 69;
const midiToHz = m  => 440 * Math.pow(2, (m - 69) / 12);
const midiName = m  => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

const MIDI_LO = 54;  // F#3
const MIDI_HI = 78;  // F#5

function foldMidi(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

const INST = { harp:0, bass:1, bass_drum:2, snare:3, hat:4, guitar:5,
               flute:6, bell:7, chime:8, xylophone:9, iron_xylophone:10,
               cow_bell:11, didgeridoo:12, bit:13, banjo:14, pling:15 };

function framePeaks(samples, offset, sr, maxPeaks, threshDB) {
  const re = new Float32Array(FFT_N);
  const im = new Float32Array(FFT_N);
  const end = Math.min(FFT_N, samples.length - offset);
  for (let i = 0; i < end; i++) re[i] = samples[offset + i] * HANN[i];
  fft(re, im);

  const fRes  = sr / FFT_N;
  const binLo = Math.max(1, Math.ceil(midiToHz(MIDI_LO - 24) / fRes));
  const binHi = Math.floor(Math.min(midiToHz(MIDI_HI + 24) / fRes, FFT_N / 2 - 1));

  const mag = new Float32Array(binHi + 2);
  for (let k = binLo; k <= binHi; k++) {
    const a = Math.sqrt(re[k]*re[k] + im[k]*im[k]) / (FFT_N / 2);
    mag[k] = 20 * Math.log10(a + 1e-12);
  }

  const peaks = [];
  for (let k = binLo + 2; k < binHi - 2; k++) {
    if (mag[k] < threshDB) continue;
    if (mag[k] > mag[k-1] && mag[k] > mag[k-2] && mag[k] > mag[k+1] && mag[k] > mag[k+2]) {
      const d2    = mag[k-1] - 2*mag[k] + mag[k+1];
      const delta = d2 !== 0 ? 0.5 * (mag[k-1] - mag[k+1]) / d2 : 0;
      const hz    = (k + delta) * fRes;
      const midi  = Math.round(hzToMidi(hz));
      if (midi >= 21 && midi <= 108) peaks.push({ midi, db: mag[k] });
    }
  }

  const best = {};
  for (const p of peaks) {
    if (!best[p.midi] || best[p.midi].db < p.db) best[p.midi] = p;
  }
  return Object.values(best).sort((a, b) => b.db - a.db).slice(0, maxPeaks);
}

function trackNotes(allPeaks, hop, sr, minDurSec) {
  const hopSec    = hop / sr;
  const minFrames = Math.max(1, Math.ceil(minDurSec / hopSec));
  const gapFrames = Math.max(1, Math.ceil(0.04 / hopSec));

  const active = new Map();
  const events = [];

  for (let f = 0; f < allPeaks.length; f++) {
    const present = new Set(allPeaks[f].map(p => p.midi));
    const dbOf    = {};
    for (const p of allPeaks[f]) dbOf[p.midi] = p.db;

    for (const [midi, info] of active) {
      if (present.has(midi)) {
        info.last = f;
        info.dbs.push(dbOf[midi]);
      } else if (f - info.last > gapFrames) {
        if (info.last - info.start + 1 >= minFrames) {
          const avgDb = info.dbs.reduce((a, b) => a + b, 0) / info.dbs.length;
          events.push({ startSec: info.start * hopSec, endSec: (info.last + 1) * hopSec, midi, db: avgDb });
        }
        active.delete(midi);
      }
    }
    for (const midi of present) {
      if (!active.has(midi)) active.set(midi, { start: f, last: f, dbs: [dbOf[midi]] });
    }
  }
  for (const [midi, info] of active) {
    if (info.last - info.start + 1 >= minFrames) {
      const avgDb = info.dbs.reduce((a, b) => a + b, 0) / info.dbs.length;
      events.push({ startSec: info.start * hopSec, endSec: (info.last + 1) * hopSec, midi, db: avgDb });
    }
  }
  return events.sort((a, b) => a.startSec - b.startSec);
}

function detectBpm(events) {
  if (events.length < 4) return 120;
  const onsets = [...new Set(events.map(e => Math.round(e.startSec * 1000)))].sort((a, b) => a - b);
  const iois = [];
  for (let i = 1; i < onsets.length; i++) {
    const d = (onsets[i] - onsets[i-1]) / 1000;
    if (d > 0.08 && d < 2.0) iois.push(d);
  }
  if (!iois.length) return 120;
  iois.sort((a, b) => a - b);
  const med  = iois[Math.floor(iois.length / 2)];
  const bpm  = 60 / med;
  const snaps = [60,70,75,80,85,90,95,100,105,110,115,120,125,128,130,140,150,160,170,180,200];
  const near  = snaps.reduce((a, b) => Math.abs(b - bpm) < Math.abs(a - bpm) ? b : a);
  return Math.abs(near - bpm) < 12 ? near : Math.round(bpm);
}

function buildNbs(events, songName, bpm, instName) {
  const tps    = (bpm / 60) * 4;
  const tempo  = Math.round((1000 / tps) * 100);
  const instId = INST[instName] ?? 0;

  const tickMap = {};
  for (const ev of events) {
    const folded = foldMidi(ev.midi);
    const nbsKey = folded - 21;
    const tick   = Math.max(0, Math.round(ev.startSec * tps));
    const vel    = Math.round(Math.max(5, Math.min(100, (ev.db + 60) / 60 * 100)));
    if (!tickMap[tick]) tickMap[tick] = new Map();
    if (!tickMap[tick].has(nbsKey)) tickMap[tick].set(nbsKey, vel);
  }

  const ticks = Object.keys(tickMap).map(Number).sort((a, b) => a - b);
  if (!ticks.length) throw new Error('No notes detected. Try Higher sensitivity.');

  const songLen    = ticks[ticks.length - 1];
  const layerCount = Math.max(...ticks.map(t => tickMap[t].size));

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => { const e = new TextEncoder().encode(s); i32(e.length); parts.push(e); };

  i16(0);
  u8(5);
  u8(16);
  i16(songLen);
  i16(layerCount);
  str(songName);
  str('Song to NoteBlock');
  str(''); str('');
  i16(tempo);
  u8(0); u8(10); u8(4);
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str('');
  u8(0); u8(0); i16(0);

  let prevTick = -1;
  for (const tick of ticks) {
    i16(tick - prevTick);
    prevTick = tick;

    const keyVelMap = tickMap[tick];
    const sortedKeys = [...keyVelMap.keys()].sort((a, b) => a - b);
    let layer = 0;
    let prevLayer = -1;
    for (const key of sortedKeys) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(instId);
      u8(key);
      u8(keyVelMap.get(key));
      u8(100);
      i16(0);
      layer++;
    }
    i16(0);
  }
  i16(0);

  for (let i = 0; i < layerCount; i++) {
    str('Layer ' + (i + 1));
    u8(0);
    u8(0);
    u8(100);
    u8(100);
  }

  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

const HOP = 1024;
const SENS_THRESH = { high: -50, med: -38, low: -26 };

async function convert(file, opts, log, setProg) {
  log('Reading audio file...');
  setProg(10);

  const arrBuf = await file.arrayBuffer();
  const actx   = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  let audioBuf;
  try {
    audioBuf = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio format. Please use WAV, OGG, or MP3.');
  }
  await actx.close();

  const sr  = audioBuf.sampleRate;
  const len = audioBuf.length;
  const mono = new Float32Array(len);
  for (let ch = 0; ch < audioBuf.numberOfChannels; ch++) {
    const d = audioBuf.getChannelData(ch);
    for (let i = 0; i < len; i++) mono[i] += d[i] / audioBuf.numberOfChannels;
  }
  log('Loaded: ' + (len / sr).toFixed(1) + 's');
  setProg(20);

  const thresh      = SENS_THRESH[opts.sens] ?? -38;
  const totalFrames = Math.floor((len - FFT_N) / HOP) + 1;
  const allPeaks    = [];
  log('Processing audio frames...');

  const CHUNK = 300;
  for (let f = 0; f < totalFrames; f += CHUNK) {
    const end = Math.min(f + CHUNK, totalFrames);
    for (let ff = f; ff < end; ff++) {
      allPeaks.push(framePeaks(mono, ff * HOP, sr, 25, thresh));
    }
    setProg(20 + Math.round((f / totalFrames) * 55));
    await new Promise(r => setTimeout(r, 0));
  }
  setProg(75);

  log('Extracting notes...');
  const events = trackNotes(allPeaks, HOP, sr, 0.07);
  if (!events.length) throw new Error('No notes found. Try a higher sensitivity.');
  setProg(85);

  let bpm = parseFloat(opts.bpm) || 0;
  if (bpm <= 0) { bpm = detectBpm(events); log('BPM (auto): ' + bpm); }
  else log('BPM: ' + bpm);

  const songName = (opts.songName || file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  log('Generating .NBS file...');
  const bytes = buildNbs(events, songName, bpm, opts.inst);
  setProg(100);

  const foldedMidis = events.map(e => foldMidi(e.midi));
  const uniqueKeys  = new Set(foldedMidis);
  const dur         = Math.max(...events.map(e => e.endSec)).toFixed(1);

  return {
    bytes,
    stats: {
      notes: events.length,
      bpm,
      dur,
      keys: uniqueKeys.size,
      lo: midiName(Math.min(...foldedMidis)),
      hi: midiName(Math.max(...foldedMidis)),
      songName,
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    bpm:      document.getElementById('bpm').value,
    sens:     document.getElementById('sens').value,
    inst:     document.getElementById('inst').value,
    songName: document.getElementById('songName').value.trim(),
  };

  try {
    const result = await convert(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> notes &middot; ' +
      '<strong>' + s.bpm + '</strong> BPM &middot; ' +
      '<strong>' + s.dur + 's</strong><br>' +
      '<strong>' + s.keys + '/25</strong> keys used &middot; ' +
      'range: ' + s.lo + ' &ndash; ' + s.hi;
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
