<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
}
.container {
  width: 100%;
  max-width: 480px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 80px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Minecraft Note Block</h1>
  <p class="subtitle">Convert audio into a clean 25-note vanilla Minecraft .nbs file</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio file</p>
    <span id="fileSub">MP3, WAV, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="mode">Mode / Polyphony</label>
      <select id="mode">
        <option value="melody_bass" selected>Melody + Bass (Cleanest)</option>
        <option value="melody_only">Melody Only (Single note)</option>
        <option value="chords">Full Chords (3 notes max)</option>
        <option value="all">All Notes (Uncapped)</option>
      </select>
    </div>
    <div class="field">
      <label for="tpsSelect">Playback Speed (TPS)</label>
      <select id="tpsSelect">
        <option value="20" selected>20 TPS (Standard Minecraft 1:1 Speed)</option>
        <option value="10">10 TPS (Redstone Repeater Speed)</option>
      </select>
    </div>
    <div class="field">
      <label for="inst">Instrument</label>
      <select id="inst">
        <option value="harp" selected>Harp (Piano)</option>
        <option value="bass">Bass Guitar</option>
        <option value="bell">Bell</option>
        <option value="flute">Flute</option>
        <option value="bit">Bit</option>
        <option value="pling">Pling</option>
      </select>
    </div>
    <div class="field">
      <label for="sens">Sensitivity</label>
      <select id="sens">
        <option value="low">Low (Only clear loud notes)</option>
        <option value="med" selected>Medium (Balanced)</option>
        <option value="high">High (Includes quiet notes)</option>
      </select>
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<script>
'use strict';

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let b = n >> 1;
    for (; j & b; b >>= 1) j ^= b;
    j ^= b;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < len >> 1; j++) {
        const ur = re[i+j], ui = im[i+j];
        const vr = re[i+j+len/2]*cr - im[i+j+len/2]*ci;
        const vi = re[i+j+len/2]*ci + im[i+j+len/2]*cr;
        re[i+j] = ur+vr; im[i+j] = ui+vi;
        re[i+j+len/2] = ur-vr; im[i+j+len/2] = ui-vi;
        const nr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nr;
      }
    }
  }
}

const FFT_N = 8192;
const HANN = new Float32Array(FFT_N);
for (let i = 0; i < FFT_N; i++) HANN[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FFT_N - 1));

const hzToMidi = hz => 12 * Math.log2(hz / 440) + 69;
const midiToHz = m  => 440 * Math.pow(2, (m - 69) / 12);
const midiName = m  => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

const MIDI_LO = 54;  // F#3
const MIDI_HI = 78;  // F#5

function foldMidi(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

const INST = { harp:0, bass:1, bass_drum:2, snare:3, hat:4, guitar:5,
               flute:6, bell:7, chime:8, xylophone:9, iron_xylophone:10,
               cow_bell:11, didgeridoo:12, bit:13, banjo:14, pling:15 };

// Extract clean fundamental frequencies by harmonic cancellation
function frameFundamentals(samples, offset, sr, maxNotes, threshDB) {
  const re = new Float32Array(FFT_N);
  const im = new Float32Array(FFT_N);
  const end = Math.min(FFT_N, samples.length - offset);
  for (let i = 0; i < end; i++) re[i] = samples[offset + i] * HANN[i];
  fft(re, im);

  const fRes = sr / FFT_N;
  const minHz = 55;   // A1
  const maxHz = 1760; // A6
  const binLo = Math.max(1, Math.ceil(minHz / fRes));
  const binHi = Math.floor(Math.min(maxHz / fRes, FFT_N / 2 - 1));

  const mag = new Float32Array(binHi + 2);
  for (let k = binLo; k <= binHi; k++) {
    const a = Math.sqrt(re[k]*re[k] + im[k]*im[k]) / (FFT_N / 2);
    mag[k] = 20 * Math.log10(a + 1e-12);
  }

  // Find candidate spectral peaks
  const peaks = [];
  for (let k = binLo + 2; k < binHi - 2; k++) {
    if (mag[k] < threshDB) continue;
    if (mag[k] > mag[k-1] && mag[k] > mag[k-2] && mag[k] > mag[k+1] && mag[k] > mag[k+2]) {
      const d2    = mag[k-1] - 2*mag[k] + mag[k+1];
      const delta = d2 !== 0 ? 0.5 * (mag[k-1] - mag[k+1]) / d2 : 0;
      const hz    = (k + delta) * fRes;
      const midi  = Math.round(hzToMidi(hz));
      if (midi >= 28 && midi <= 96) {
        peaks.push({ k, hz, midi, db: mag[k] });
      }
    }
  }

  if (!peaks.length) return [];

  // Sort peaks by amplitude descending
  peaks.sort((a, b) => b.db - a.db);

  // Harmonic overtone suppression:
  // If peak A has fundamental frequency f, suppress peaks at 2f, 3f, 4f
  const fundamentals = [];
  const suppressedBins = new Set();

  for (const p of peaks) {
    if (suppressedBins.has(p.midi)) continue;

    fundamentals.push({ midi: p.midi, db: p.db });
    if (fundamentals.length >= maxNotes) break;

    // Suppress integer harmonics of this fundamental note
    for (let h = 2; h <= 5; h++) {
      const harmMidi = Math.round(hzToMidi(p.hz * h));
      suppressedBins.add(harmMidi);
      suppressedBins.add(harmMidi - 1);
      suppressedBins.add(harmMidi + 1);
    }
  }

  return fundamentals;
}

// Convert frame fundamentals to clean musical note events
function extractCleanNotes(samples, sr, mode, threshDB, tps, progressCb) {
  const hop = Math.round(sr / tps); // Exact samples per tick!
  const totalTicks = Math.floor((samples.length - FFT_N) / hop);

  let maxNotesPerTick = 2;
  if (mode === 'melody_only') maxNotesPerTick = 1;
  else if (mode === 'melody_bass') maxNotesPerTick = 2;
  else if (mode === 'chords') maxNotesPerTick = 3;
  else if (mode === 'all') maxNotesPerTick = 25;

  const tickNotes = new Map();
  let prevActiveMidis = new Set();
  let lastNoteTime = new Map(); // midi -> tick

  for (let t = 0; t < totalTicks; t++) {
    const offset = t * hop;
    const notes = frameFundamentals(samples, offset, sr, maxNotesPerTick, threshDB);

    const currentTickMidis = new Map();
    for (const n of notes) {
      const folded = foldMidi(n.midi);
      const nbsKey = folded - 21; // 33..57

      // Debounce: prevent machine-gun retriggering of exact same key on consecutive ticks
      // unless there is a gap of at least 2 ticks
      const lastTick = lastNoteTime.get(nbsKey) ?? -999;
      if (t - lastTick >= 2 || !prevActiveMidis.has(nbsKey)) {
        const vel = Math.round(Math.max(20, Math.min(100, (n.db + 50) / 45 * 100)));
        currentTickMidis.set(nbsKey, vel);
        lastNoteTime.set(nbsKey, t);
      }
    }

    if (currentTickMidis.size > 0) {
      tickNotes.set(t, currentTickMidis);
      prevActiveMidis = new Set(currentTickMidis.keys());
    } else {
      prevActiveMidis.clear();
    }

    if (t % 100 === 0 && progressCb) {
      progressCb(Math.round((t / totalTicks) * 70));
    }
  }

  return { tickNotes, totalTicks };
}

function buildNbsBinary(tickNotes, totalTicks, songName, tps, instName) {
  const tempo = Math.round(tps * 100); // NBS tempo = TPS * 100 (e.g. 20 TPS -> 2000)
  const instId = INST[instName] ?? 0;

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, new Map([[33, 100]]));
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).size;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS version 5)
  i16(0);          // 0x0000 = NBS v5 flag
  u8(5);           // version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // 2000 = 20 TPS
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const keyMap = tickNotes.get(tick);
    const sortedKeys = [...keyMap.keys()].sort((a, b) => a - b);
    let layer = 0;
    let prevLayer = -1;
    for (const key of sortedKeys) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(instId);
      u8(key);           // NBS key 33..57
      u8(keyMap.get(key)); // velocity
      u8(100);           // center panning
      i16(0);            // pitch 0
      layer++;
    }
    i16(0);
  }
  i16(0);

  // Layers section
  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  // Custom instruments count (0)
  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

const SENS_THRESH = { high: -44, med: -34, low: -24 };

async function processAudioFile(file, opts, log, setProg) {
  log('Reading audio file...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  let audioBuf;
  try {
    audioBuf = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio format. Please try converting your file to WAV or MP3.');
  }
  await actx.close();

  const sr = audioBuf.sampleRate;
  const len = audioBuf.length;
  const mono = new Float32Array(len);
  for (let ch = 0; ch < audioBuf.numberOfChannels; ch++) {
    const d = audioBuf.getChannelData(ch);
    for (let i = 0; i < len; i++) mono[i] += d[i] / audioBuf.numberOfChannels;
  }
  const durationSec = (len / sr).toFixed(1);
  log('Loaded: ' + durationSec + 's audio');
  setProg(15);

  const tps = parseInt(opts.tps) || 20;
  const thresh = SENS_THRESH[opts.sens] ?? -34;

  log('Extracting clean notes (harmonic suppression + tempo sync @ ' + tps + ' TPS)...');
  const { tickNotes, totalTicks } = extractCleanNotes(mono, sr, opts.mode, thresh, tps, p => {
    setProg(15 + p);
  });
  setProg(85);

  let totalNotesCount = 0;
  const uniqueKeys = new Set();
  for (const [t, kmap] of tickNotes) {
    totalNotesCount += kmap.size;
    for (const k of kmap.keys()) uniqueKeys.add(k);
  }

  log('Extracted ' + totalNotesCount + ' note events across ' + uniqueKeys.size + '/25 Minecraft keys.');
  setProg(92);

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  log('Building .NBS binary file...');
  const bytes = buildNbsBinary(tickNotes, totalTicks, songName, tps, opts.inst);
  setProg(100);
  log('Complete! Song matches 1:1 original speed.');

  return {
    bytes,
    stats: {
      notes: totalNotesCount,
      tps,
      dur: durationSec,
      keys: uniqueKeys.size,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    mode: document.getElementById('mode').value,
    tps:  document.getElementById('tpsSelect').value,
    inst: document.getElementById('inst').value,
    sens: document.getElementById('sens').value,
  };

  try {
    const result = await processAudioFile(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> notes &middot; ' +
      '<strong>' + s.tps + ' TPS</strong> (1:1 Original Speed) &middot; ' +
      '<strong>' + s.dur + 's</strong> duration<br>' +
      '<strong>' + s.keys + '/25</strong> vanilla Minecraft keys used';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
