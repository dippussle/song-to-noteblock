<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Minecraft Note Blocks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
h1{font-size:1.8em;margin-bottom:6px;color:#7fb3d3}
.sub{color:#555;font-size:.82em;margin-bottom:30px}
.drop{width:100%;max-width:500px;border:2px dashed #2a2a4a;border-radius:12px;padding:42px 20px;text-align:center;cursor:pointer;background:#16213e;transition:.2s;margin-bottom:18px;user-select:none}
.drop:hover,.drop.over{border-color:#7fb3d3;background:#1a2a40}
.drop .ico{font-size:2.2em;margin-bottom:10px}
.drop small{color:#444;display:block;margin-top:6px;font-size:.78em}
.controls{width:100%;max-width:500px;display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
label{display:block;font-size:.73em;color:#555;margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
select,input[type=number],input[type=text]{width:100%;background:#16213e;border:1px solid #2a2a4a;color:#ccc;padding:8px 10px;border-radius:6px;font-size:.87em;outline:none}
select:focus,input:focus{border-color:#7fb3d3}
.row{display:flex;gap:10px;margin-top:4px;align-items:center}
.btn{padding:10px 26px;border:none;border-radius:7px;font-size:.93em;cursor:pointer;transition:.15s;font-weight:500}
.btn-go{background:#2a6f97;color:#fff}
.btn-go:hover{background:#3a8fc7}
.btn-go:disabled{background:#1e2a38;color:#3a4a5a;cursor:not-allowed}
.btn-dl{background:#2d7a44;color:#fff;display:none}
.btn-dl:hover{background:#3d9a54}
.progress{width:100%;max-width:500px;margin-top:16px;display:none}
.track{background:#1e1e30;border-radius:4px;height:5px;overflow:hidden;margin-bottom:7px}
.fill{background:#7fb3d3;height:100%;width:0%;transition:width .2s;border-radius:4px}
.log{font-family:monospace;font-size:.73em;color:#444;line-height:1.65;max-height:90px;overflow-y:auto}
.stats{width:100%;max-width:500px;margin-top:14px;display:none;background:#16213e;border:1px solid #1e3050;border-radius:9px;padding:14px 16px;font-size:.81em;color:#666;line-height:2.1}
.stats b{color:#7fb3d3}
a.about{display:block;margin-top:28px;font-size:.72em;color:#333;text-decoration:none;text-align:center}
a.about:hover{color:#7fb3d3}
</style>
</head>
<body>
<h1>Song to Minecraft Note Blocks</h1>
<p class="sub">Drop an audio file &rarr; get a .nbs file for <a href="https://noteblock.studio" target="_blank" style="color:#7fb3d3">Note Block Studio</a></p>

<div class="drop" id="drop">
  <div class="ico">&#127925;</div>
  <strong id="dropLabel">Drop audio file here</strong>
  <small id="dropSub">click to browse &middot; MP3, WAV, OGG, M4A, FLAC</small>
  <input type="file" id="fileIn" accept=".mp3,.wav,.ogg,.m4a,.flac,.aac" style="display:none">
</div>

<div class="controls">
  <div>
    <label>BPM (0 = auto)</label>
    <input type="number" id="bpm" value="0" min="0" max="400" step="1">
  </div>
  <div>
    <label>Sensitivity</label>
    <select id="sens">
      <option value="high">High &ndash; more notes</option>
      <option value="med" selected>Medium</option>
      <option value="low">Low &ndash; cleaner</option>
    </select>
  </div>
  <div>
    <label>Instrument</label>
    <select id="inst">
      <option value="harp" selected>Harp (vanilla default)</option>
      <option value="bass">Bass Guitar</option>
      <option value="bell">Bell</option>
      <option value="flute">Flute</option>
      <option value="bit">Bit (chiptune)</option>
      <option value="pling">Pling (guitar)</option>
    </select>
  </div>
  <div>
    <label>Song name</label>
    <input type="text" id="sname" placeholder="auto from filename">
  </div>
</div>

<div class="row">
  <button class="btn btn-go" id="cvtBtn" disabled>Convert</button>
  <button class="btn btn-dl" id="dlBtn">&#11015; Download .nbs</button>
</div>

<div class="progress" id="prog">
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="log" id="logEl"></div>
</div>
<div class="stats" id="statsEl"></div>

<a class="about" href="https://github.com" target="_blank">Outputs vanilla-compatible .nbs (25 notes, F#3&ndash;F#5 &middot; pitches folded by octave)</a>

<script>
'use strict';

// =====================================================
// Cooley-Tukey radix-2 FFT (in-place, power-of-2)
// =====================================================
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let b = n >> 1;
    for (; j & b; b >>= 1) j ^= b;
    j ^= b;
    if (i < j) {
      [re[i], re[j]] = [re[j], re[i]];
      [im[i], im[j]] = [im[j], im[i]];
    }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < len >> 1; j++) {
        const ur = re[i+j], ui = im[i+j];
        const vr = re[i+j+len/2]*cr - im[i+j+len/2]*ci;
        const vi = re[i+j+len/2]*ci + im[i+j+len/2]*cr;
        re[i+j] = ur+vr; im[i+j] = ui+vi;
        re[i+j+len/2] = ur-vr; im[i+j+len/2] = ui-vi;
        const nr = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = nr;
      }
    }
  }
}

// =====================================================
// Precomputed Hann window
// =====================================================
const FFT_N = 8192;
const HANN = new Float32Array(FFT_N);
for (let i = 0; i < FFT_N; i++) HANN[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FFT_N - 1));

// =====================================================
// Pitch helpers
// =====================================================
const hzToMidi = hz => 12 * Math.log2(hz / 440) + 69;
const midiToHz = m  => 440 * Math.pow(2, (m - 69) / 12);
const midiName = m  => ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

// Vanilla Minecraft note block range: F#3 (MIDI 54) to F#5 (MIDI 78) = 25 notes
// NBS absolute key = midi - 21  ->  range 33..57 for this window
const MIDI_LO = 54;  // F#3
const MIDI_HI = 78;  // F#5

// Fold any MIDI pitch into the vanilla 25-note range via octave transposition
function foldMidi(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

// NBS instrument IDs
const INST = { harp:0, bass:1, bass_drum:2, snare:3, hat:4, guitar:5,
               flute:6, bell:7, chime:8, xylophone:9, iron_xylophone:10,
               cow_bell:11, didgeridoo:12, bit:13, banjo:14, pling:15 };

// =====================================================
// Per-frame spectral peak picking
// Returns [{midi, db}] for detected pitches
// =====================================================
function framePeaks(samples, offset, sr, maxPeaks, threshDB) {
  const re = new Float32Array(FFT_N);
  const im = new Float32Array(FFT_N);
  const end = Math.min(FFT_N, samples.length - offset);
  for (let i = 0; i < end; i++) re[i] = samples[offset + i] * HANN[i];
  fft(re, im);

  const fRes  = sr / FFT_N;
  const binLo = Math.max(1, Math.ceil(midiToHz(MIDI_LO - 24) / fRes));
  const binHi = Math.floor(Math.min(midiToHz(MIDI_HI + 24) / fRes, FFT_N / 2 - 1));

  const mag = new Float32Array(binHi + 2);
  for (let k = binLo; k <= binHi; k++) {
    const a = Math.sqrt(re[k]*re[k] + im[k]*im[k]) / (FFT_N / 2);
    mag[k] = 20 * Math.log10(a + 1e-12);
  }

  const peaks = [];
  for (let k = binLo + 2; k < binHi - 2; k++) {
    if (mag[k] < threshDB) continue;
    if (mag[k] > mag[k-1] && mag[k] > mag[k-2] && mag[k] > mag[k+1] && mag[k] > mag[k+2]) {
      const d2    = mag[k-1] - 2*mag[k] + mag[k+1];
      const delta = d2 !== 0 ? 0.5 * (mag[k-1] - mag[k+1]) / d2 : 0;
      const hz    = (k + delta) * fRes;
      const midi  = Math.round(hzToMidi(hz));
      if (midi >= 21 && midi <= 108) peaks.push({ midi, db: mag[k] });
    }
  }

  // Best peak per MIDI note, top N
  const best = {};
  for (const p of peaks) {
    if (!best[p.midi] || best[p.midi].db < p.db) best[p.midi] = p;
  }
  return Object.values(best).sort((a, b) => b.db - a.db).slice(0, maxPeaks);
}

// =====================================================
// Frame peaks -> note events (simple onset/offset tracker)
// =====================================================
function trackNotes(allPeaks, hop, sr, minDurSec) {
  const hopSec    = hop / sr;
  const minFrames = Math.max(1, Math.ceil(minDurSec / hopSec));
  const gapFrames = Math.max(1, Math.ceil(0.04 / hopSec));  // 40 ms gap tolerance

  const active = new Map();   // midi -> {start, last, dbs[]}
  const events = [];

  for (let f = 0; f < allPeaks.length; f++) {
    const present = new Set(allPeaks[f].map(p => p.midi));
    const dbOf    = {};
    for (const p of allPeaks[f]) dbOf[p.midi] = p.db;

    for (const [midi, info] of active) {
      if (present.has(midi)) {
        info.last = f;
        info.dbs.push(dbOf[midi]);
      } else if (f - info.last > gapFrames) {
        if (info.last - info.start + 1 >= minFrames) {
          const avgDb = info.dbs.reduce((a, b) => a + b, 0) / info.dbs.length;
          events.push({ startSec: info.start * hopSec, endSec: (info.last + 1) * hopSec, midi, db: avgDb });
        }
        active.delete(midi);
      }
    }
    for (const midi of present) {
      if (!active.has(midi)) active.set(midi, { start: f, last: f, dbs: [dbOf[midi]] });
    }
  }
  for (const [midi, info] of active) {
    if (info.last - info.start + 1 >= minFrames) {
      const avgDb = info.dbs.reduce((a, b) => a + b, 0) / info.dbs.length;
      events.push({ startSec: info.start * hopSec, endSec: (info.last + 1) * hopSec, midi, db: avgDb });
    }
  }
  return events.sort((a, b) => a.startSec - b.startSec);
}

// =====================================================
// BPM auto-detection from note onsets
// =====================================================
function detectBpm(events) {
  if (events.length < 4) return 120;
  const onsets = [...new Set(events.map(e => Math.round(e.startSec * 1000)))].sort((a, b) => a - b);
  const iois = [];
  for (let i = 1; i < onsets.length; i++) {
    const d = (onsets[i] - onsets[i-1]) / 1000;
    if (d > 0.08 && d < 2.0) iois.push(d);
  }
  if (!iois.length) return 120;
  iois.sort((a, b) => a - b);
  const med  = iois[Math.floor(iois.length / 2)];
  const bpm  = 60 / med;
  const snaps = [60,70,75,80,85,90,95,100,105,110,115,120,125,128,130,140,150,160,170,180,200];
  const near  = snaps.reduce((a, b) => Math.abs(b - bpm) < Math.abs(a - bpm) ? b : a);
  return Math.abs(near - bpm) < 12 ? near : Math.round(bpm);
}

// =====================================================
// NBS v5 binary writer
// All notes folded to vanilla 25-note range (keys 33-57)
// Up to 25 simultaneous notes per tick (one per layer)
// =====================================================
function buildNbs(events, songName, bpm, instName) {
  const tps    = (bpm / 60) * 4;               // ticks/sec on 16th-note grid
  const tempo  = Math.round((1000 / tps) * 100); // NBS tempo (hundredths of ms per tick)
  const instId = INST[instName] ?? 0;

  // Group events by tick; fold MIDI into vanilla range; deduplicate keys per tick
  const tickMap = {};
  for (const ev of events) {
    const folded = foldMidi(ev.midi);
    const nbsKey = folded - 21;                          // absolute NBS key (33-57 for harp range)
    const tick   = Math.max(0, Math.round(ev.startSec * tps));
    const vel    = Math.round(Math.max(5, Math.min(100, (ev.db + 60) / 60 * 100)));
    if (!tickMap[tick]) tickMap[tick] = new Map();
    // One note per unique key per tick (25 keys max = 25 simultaneous notes)
    if (!tickMap[tick].has(nbsKey)) tickMap[tick].set(nbsKey, vel);
  }

  const ticks = Object.keys(tickMap).map(Number).sort((a, b) => a - b);
  if (!ticks.length) throw new Error('No notes produced. Try Higher sensitivity.');

  const songLen    = ticks[ticks.length - 1];
  const layerCount = Math.max(...ticks.map(t => tickMap[t].size));

  // Binary helpers - little-endian
  const parts = [];
  const u8  = v => { const b = new Uint8Array(1);  b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2);  new DataView(b.buffer).setInt16(0, v, true);  parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4);  new DataView(b.buffer).setInt32(0, v, true);  parts.push(b); };
  const str = s => { const e = new TextEncoder().encode(s); i32(e.length); parts.push(e); };

  // ── Header (NBS v5) ──────────────────────────
  i16(0);          // 0x0000 = new-format marker
  u8(5);           // version 5
  u8(16);          // vanilla instrument count (1.21+)
  i16(songLen);    // song length in ticks
  i16(layerCount); // layer count
  str(songName);
  str('Song to NoteBlock');
  str(''); str('');    // original author, description
  i16(tempo);          // tempo
  u8(0); u8(10); u8(4); // auto-save off, duration, time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0); // stats (zeros)
  str('');              // source MIDI name
  u8(0); u8(0); i16(0); // loop off

  // ── Notes section ────────────────────────────
  // Encoding: for each tick group write tick_jump (i16), then per note: layer_jump (i16) +
  // instrument (u8) + key (u8) + velocity (u8) + panning (u8) + pitch (i16),
  // end group with layer_jump=0, end section with tick_jump=0.
  // Tick pointer starts at -1, layer pointer resets to -1 per tick.
  let prevTick = -1;
  for (const tick of ticks) {
    i16(tick - prevTick);  // always >= 1 since prevTick starts at -1 and tick >= 0
    prevTick = tick;

    const keyVelMap = tickMap[tick];
    const sortedKeys = [...keyVelMap.keys()].sort((a, b) => a - b);
    let layer = 0;
    let prevLayer = -1;
    for (const key of sortedKeys) {
      i16(layer - prevLayer);  // layer jump (always >= 1)
      prevLayer = layer;
      u8(instId);        // instrument
      u8(key);           // NBS key 33-57 (vanilla range)
      u8(keyVelMap.get(key)); // velocity 0-100
      u8(100);           // panning (100 = center)
      i16(0);            // pitch bend (0 = none)
      layer++;
    }
    i16(0); // end of tick group
  }
  i16(0); // end of notes section

  // ── Layers section ───────────────────────────
  for (let i = 0; i < layerCount; i++) {
    str('Layer ' + (i + 1));
    u8(0);    // lock = false
    u8(0);    // solo = false
    u8(100);  // volume
    u8(100);  // panning center
  }

  // ── Custom instruments (none) ─────────────────
  u8(0);

  // ── Assemble all chunks ───────────────────────
  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// =====================================================
// Main pipeline
// =====================================================
const HOP = 1024;
const SENS_THRESH = { high: -50, med: -38, low: -26 };

async function convert(file, opts, log, setProg) {
  log('Loading audio...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx   = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  let audioBuf;
  try {
    audioBuf = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Could not decode audio. WAV and OGG always work; MP3 needs browser MP3 support.');
  }
  await actx.close();

  const sr  = audioBuf.sampleRate;
  const len = audioBuf.length;
  const mono = new Float32Array(len);
  for (let ch = 0; ch < audioBuf.numberOfChannels; ch++) {
    const d = audioBuf.getChannelData(ch);
    for (let i = 0; i < len; i++) mono[i] += d[i] / audioBuf.numberOfChannels;
  }
  log('Loaded: ' + (len / sr).toFixed(1) + 's at ' + sr + ' Hz');
  setProg(12);

  const thresh      = SENS_THRESH[opts.sens] ?? -38;
  const totalFrames = Math.floor((len - FFT_N) / HOP) + 1;
  const allPeaks    = [];
  log('Analyzing ' + totalFrames + ' frames...');

  const CHUNK = 300;
  for (let f = 0; f < totalFrames; f += CHUNK) {
    const end = Math.min(f + CHUNK, totalFrames);
    for (let ff = f; ff < end; ff++) {
      allPeaks.push(framePeaks(mono, ff * HOP, sr, 25, thresh));
    }
    setProg(12 + Math.round((f / totalFrames) * 55));
    await new Promise(r => setTimeout(r, 0));
  }
  setProg(68);

  log('Grouping note events...');
  const events = trackNotes(allPeaks, HOP, sr, 0.07);
  log('Detected ' + events.length + ' note events');
  if (!events.length) throw new Error('No notes found. Try a higher sensitivity setting.');
  setProg(78);

  let bpm = parseFloat(opts.bpm) || 0;
  if (bpm <= 0) { bpm = detectBpm(events); log('Auto BPM: ' + bpm); }
  else log('BPM: ' + bpm);
  setProg(84);

  const songName = (opts.songName || file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  log('Writing NBS file...');
  const bytes = buildNbs(events, songName, bpm, opts.inst);
  setProg(100);

  const foldedMidis = events.map(e => foldMidi(e.midi));
  const uniqueKeys  = new Set(foldedMidis);
  const dur         = Math.max(...events.map(e => e.endSec)).toFixed(1);
  log('Done: ' + events.length + ' notes, ' + uniqueKeys.size + '/25 keys used, ' + bpm + ' BPM');

  return {
    bytes,
    stats: {
      notes: events.length,
      bpm,
      dur,
      keys: uniqueKeys.size,
      lo: midiName(Math.min(...foldedMidis)),
      hi: midiName(Math.max(...foldedMidis)),
      songName,
    }
  };
}

// =====================================================
// UI wiring
// =====================================================
let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropEl  = document.getElementById('drop');
const fileIn  = document.getElementById('fileIn');
const cvtBtn  = document.getElementById('cvtBtn');
const dlBtn   = document.getElementById('dlBtn');
const progEl  = document.getElementById('prog');
const fillEl  = document.getElementById('fill');
const logEl   = document.getElementById('logEl');
const statsEl = document.getElementById('statsEl');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('dropLabel').textContent = f.name;
  document.getElementById('dropSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  cvtBtn.disabled = false;
}

dropEl.addEventListener('click',     ()  => fileIn.click());
fileIn.addEventListener('change',    e   => setFile(e.target.files[0]));
dropEl.addEventListener('dragover',  e   => { e.preventDefault(); dropEl.classList.add('over'); });
dropEl.addEventListener('dragleave', ()  => dropEl.classList.remove('over'));
dropEl.addEventListener('drop',      e   => { e.preventDefault(); dropEl.classList.remove('over'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

cvtBtn.addEventListener('click', async () => {
  if (!curFile) return;
  cvtBtn.disabled = true;
  dlBtn.style.display = 'none';
  progEl.style.display = 'block';
  statsEl.style.display = 'none';
  fillEl.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    bpm:     document.getElementById('bpm').value,
    sens:    document.getElementById('sens').value,
    inst:    document.getElementById('inst').value,
    songName:document.getElementById('sname').value.trim(),
  };

  try {
    const result = await convert(curFile, opts, addLog, p => { fillEl.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    dlBtn.style.display = 'inline-block';
    statsEl.innerHTML =
      '<b>' + s.notes + '</b> note events &nbsp;&middot;&nbsp; ' +
      '<b>' + s.bpm + '</b> BPM &nbsp;&middot;&nbsp; ' +
      '<b>' + s.dur + 's</b> long<br>' +
      '<b>' + s.keys + ' / 25</b> keys used &nbsp;&middot;&nbsp; ' +
      'range <b>' + s.lo + ' &ndash; ' + s.hi + '</b> (folded to vanilla F#3&ndash;F#5)';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('ERROR: ' + e.message);
  }
  cvtBtn.disabled = false;
});

dlBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
