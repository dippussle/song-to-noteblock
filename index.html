<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 90px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Convert audio into clear vanilla Minecraft note block music</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="arrangement">Arrangement</label>
      <select id="arrangement">
        <option value="auto_orchestra" selected>Smart Orchestra (Bass + Piano + Bells)</option>
        <option value="piano_only">Harp / Piano Solo</option>
        <option value="lead_only">Lead Melody Only</option>
      </select>
    </div>
    <div class="field">
      <label for="clarity">Clarity Level</label>
      <select id="clarity">
        <option value="crystal" selected>Crystal Clear (Remove noise/clutter)</option>
        <option value="rich">Rich Chords (More harmonies)</option>
      </select>
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v2.0.0</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

// Minecraft Vanilla Instruments
const NBS_HARP  = 0; // Dirt (Piano / Lead)
const NBS_BASS  = 1; // Wood (Bass Guitar)
const NBS_FLUTE = 6; // Clay (Flute)
const NBS_BELL  = 7; // Gold (Bell / Chime)
const NBS_PLING = 15; // Glowstone (Electric Guitar/Pling)

// MIDI pitch bounds for vanilla 25 notes
const MIDI_FSHARP3 = 54;
const MIDI_FSHARP5 = 78;

function foldToVanillaRange(midi) {
  let m = midi;
  while (m < MIDI_FSHARP3) m += 12;
  while (m > MIDI_FSHARP5) m -= 12;
  return Math.max(MIDI_FSHARP3, Math.min(MIDI_FSHARP5, m));
}

// Smart Instrument Assignment:
// Bass notes (MIDI < 50) -> Bass guitar
// Mid notes (50..74)     -> Harp (Piano)
// High notes (> 74)      -> Bell / Flute
function assignInstrument(originalMidi, arrangement) {
  if (arrangement === 'piano_only') return NBS_HARP;

  if (originalMidi < 50) {
    return NBS_BASS;
  } else if (originalMidi <= 74) {
    return NBS_HARP;
  } else {
    return NBS_BELL;
  }
}

function buildNbsBinary(tickNotes, songName, tps) {
  const tempo = Math.round(tps * 100); // 20 TPS -> 2000

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ inst: 0, key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS v5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // 2000 = 20 TPS (1:1 real-time speed)
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(n.inst);        // Instrument ID (Bass, Harp, Bell)
      u8(n.key);         // Key (33..57 vanilla 25 notes)
      u8(n.vel);         // Velocity (0..100)
      u8(100);           // Center panning
      i16(0);            // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  // Layers section
  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  // Custom instruments count (0)
  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Smart Note Post-Processing:
// 1. Removes tiny ghost noise notes
// 2. Separates notes by frequency bands (Bass vs Mid vs High)
// 3. Selects the most prominent harmonic notes per beat
function processAndOrchestrateNotes(rawNotes, arrangement, clarity, tps) {
  // Sort notes by start time
  const sorted = [...rawNotes].sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);

  // Filter thresholds based on clarity
  const minAmp = clarity === 'crystal' ? 0.38 : 0.25;
  const minDur = clarity === 'crystal' ? 0.08 : 0.05;

  const validNotes = sorted.filter(n => n.amplitude >= minAmp && n.durationSeconds >= minDur);

  const tickMap = new Map(); // tick -> array of { inst, key, vel, origMidi, amp }

  for (const n of validNotes) {
    const tick = Math.max(0, Math.round(n.startTimeSeconds * tps));
    const origMidi = Math.round(n.pitchMidi);
    const foldedMidi = foldToVanillaRange(origMidi);
    const nbsKey = foldedMidi - 21; // 33..57

    const inst = assignInstrument(origMidi, arrangement);
    const vel = Math.round(Math.max(30, Math.min(100, n.amplitude * 110)));

    if (!tickMap.has(tick)) tickMap.set(tick, []);
    tickMap.get(tick).push({ inst, key: nbsKey, vel, origMidi, amp: n.amplitude });
  }

  // Clean up each tick to prevent cacophony
  const cleanedTicks = new Map();
  let lastInstKeyTick = new Map(); // `${inst}_${key}` -> lastTick

  for (const [tick, notes] of tickMap) {
    // Sort notes in this tick by loudness
    notes.sort((a, b) => b.amp - a.amp);

    const chosen = [];
    const usedKeysInTick = new Set();
    const usedInstsInTick = new Map();

    const maxNotesThisTick = arrangement === 'lead_only' ? 1 : (clarity === 'crystal' ? 3 : 5);

    for (const n of notes) {
      if (chosen.length >= maxNotesThisTick) break;

      const instCount = usedInstsInTick.get(n.inst) || 0;
      // Max 1 bass note, max 2 melody notes per tick
      if (n.inst === NBS_BASS && instCount >= 1) continue;
      if (n.inst === NBS_BELL && instCount >= 1) continue;
      if (n.inst === NBS_HARP && instCount >= 2) continue;

      // Deduplicate identical key on same tick
      const keyId = `${n.inst}_${n.key}`;
      if (usedKeysInTick.has(keyId)) continue;

      // Prevent machine-gun rapid re-triggering of exact same note block (min 2 ticks gap)
      const prevTick = lastInstKeyTick.get(keyId) ?? -999;
      if (tick - prevTick < 2) continue;

      chosen.push(n);
      usedKeysInTick.add(keyId);
      usedInstsInTick.set(n.inst, instCount + 1);
      lastInstKeyTick.set(keyId, tick);
    }

    if (chosen.length > 0) {
      cleanedTicks.set(tick, chosen);
    }
  }

  return cleanedTicks;
}

async function runHighQualityConversion(file, opts, log, setProg) {
  log('Reading ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Could not decode audio. Please ensure the file is an MP3, WAV, MP4, or OGG file.');
  }

  // Downmix to true Mono AudioBuffer for the AI Neural Network
  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration.toFixed(1);
  log('Audio loaded: ' + durationSec + 's duration.');
  setProg(15);

  if (!basicPitchInstance) {
    log('Loading Spotify Pitch Neural Network...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Transcribing music with AI Neural Network...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 65));
    }
  );

  log('Orchestrating Minecraft note block layers...');
  setProg(85);

  const onsetThresh = opts.clarity === 'crystal' ? 0.6 : 0.45;
  const frameThresh = opts.clarity === 'crystal' ? 0.4 : 0.3;
  const minNoteLen  = opts.clarity === 'crystal' ? 7 : 5;

  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    onsetThresh,
    frameThresh,
    minNoteLen,
    true,
    null,
    null,
    true // Melodia trick for clean melody extraction
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  log('Detected ' + noteEvents.length + ' raw note events.');

  const tps = 20; // 20 TPS = 1:1 real-time Minecraft speed
  const orchestratedTicks = processAndOrchestrateNotes(noteEvents, opts.arrangement, opts.clarity, tps);

  let totalNotesCount = 0;
  let bassCount = 0, harpCount = 0, bellCount = 0;
  for (const [t, list] of orchestratedTicks) {
    totalNotesCount += list.length;
    for (const n of list) {
      if (n.inst === NBS_BASS) bassCount++;
      else if (n.inst === NBS_HARP) harpCount++;
      else if (n.inst === NBS_BELL) bellCount++;
    }
  }

  log('Orchestrated: ' + harpCount + ' Piano + ' + bassCount + ' Bass + ' + bellCount + ' Bell notes.');
  setProg(95);

  log('Building .NBS file (20 TPS)...');
  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(orchestratedTicks, songName, tps);
  setProg(100);
  log('Conversion complete!');

  return {
    bytes,
    stats: {
      notes: totalNotesCount,
      harp: harpCount,
      bass: bassCount,
      bell: bellCount,
      tps,
      dur: durationSec,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    arrangement: document.getElementById('arrangement').value,
    clarity:     document.getElementById('clarity').value,
  };

  try {
    const result = await runHighQualityConversion(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> clean notes total &middot; ' +
      '<strong>' + s.dur + 's</strong> duration<br>' +
      'Orchestra: <strong>' + s.harp + '</strong> Piano &middot; <strong>' + s.bass + '</strong> Bass &middot; <strong>' + s.bell + '</strong> Bells';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
