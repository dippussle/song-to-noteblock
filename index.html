<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.35rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 36px 18px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 18px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.95rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: background 0.15s;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 14px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 120px;
  overflow-y: auto;
  margin-top: 10px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Convert audio into full 88-note Harp piano music (.nbs)</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v5.0.0 (Full 88 Harp)</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

const NBS_HARP = 0; // 100% Harp instrument
const TPS = 20;     // Exact 20.00 TPS real-time clock (1 tick = 50ms)

// Full 88 piano keys: MIDI 21 (A0) to MIDI 108 (C8) -> NBS keys 0 to 87
// No octave folding! Every note plays in its true, natural pitch!
function midiToNbsKey(midi) {
  return Math.max(0, Math.min(87, Math.round(midi) - 21));
}

function buildNbsBinary(tickNotes, songName) {
  const tempo = TPS * 100; // Exact 2000 = 20.00 TPS

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS v5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // 2000 = 20.00 TPS real-time
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section - ALL NOTES ARE HARP across the full 88 piano keys (0..87)
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(NBS_HARP);     // 100% Harp
      u8(n.key);        // Key (0..87 full 88-key piano)
      u8(n.vel);        // Velocity (0..100)
      u8(100);          // Center panning
      i16(0);           // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// 88-Key Music Processing:
// Allows full piano chords and rich polyphony with zero octave distortion
function process88KeyNotes(noteEvents) {
  const sorted = [...noteEvents].sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);

  const rawTickMap = new Map();

  for (const n of sorted) {
    const tick = Math.max(0, Math.round(n.startTimeSeconds * TPS));
    const nbsKey = midiToNbsKey(n.pitchMidi); // 0 to 87 true pitch!

    // Clear dynamic velocity
    const vel = Math.round(Math.max(60, Math.min(100, 50 + n.amplitude * 55)));

    if (!rawTickMap.has(tick)) rawTickMap.set(tick, []);
    rawTickMap.get(tick).push({
      key: nbsKey,
      vel,
      amp: n.amplitude,
      origMidi: n.pitchMidi
    });
  }

  // Allow rich chords across 88 keys (up to 5 simultaneous notes per tick)
  const cleanedTicks = new Map();

  for (const [tick, notes] of rawTickMap) {
    notes.sort((a, b) => b.amp - a.amp);

    const chosen = [];
    const usedKeys = new Set();

    for (const n of notes) {
      if (chosen.length >= 5) break; // Rich chords across bass, mid, lead
      if (usedKeys.has(n.key)) continue;

      chosen.push(n);
      usedKeys.add(n.key);
    }

    if (chosen.length > 0) {
      cleanedTicks.set(tick, chosen);
    }
  }

  return cleanedTicks;
}

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

let curFile = null, dlBlob = null, dlName = 'song.nbs';

function addLog(msg) {
  console.log(msg);
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

window.addEventListener('error', e => addLog('Error: ' + e.message));
window.addEventListener('unhandledrejection', e => addLog('Error: ' + (e.reason ? e.reason.message || e.reason : 'Unknown')));

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
  addLog('Selected: ' + f.name);
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

async function runAutoConversion(file, setProg) {
  const startTime = performance.now();
  addLog('Decoding audio: ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio. Please ensure file is a valid MP3, WAV, MP4, or OGG.');
  }

  // Mono downmix
  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration;
  addLog('Audio loaded: ' + durationSec.toFixed(1) + 's.');
  setProg(15);

  if (!basicPitchInstance) {
    addLog('Loading AI Neural Network...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  addLog('Transcribing with AI Neural Network...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 70));
    }
  );

  addLog('Extracting full 88-key piano harmonies...');
  setProg(88);

  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    0.35,  // Clean onset threshold
    0.20,  // Frame threshold
    3,     // Min note length
    true,
    null,
    null,
    true
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  addLog('Transcribed ' + noteEvents.length + ' notes across all 88 keys.');
  setProg(94);

  const tickNotes = process88KeyNotes(noteEvents);

  let totalHarpNotes = 0;
  const uniqueKeys = new Set();
  for (const [t, list] of tickNotes) {
    totalHarpNotes += list.length;
    for (const n of list) uniqueKeys.add(n.key);
  }

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(tickNotes, songName);
  setProg(100);

  const elapsedTime = ((performance.now() - startTime) / 1000).toFixed(1);
  addLog('Done in ' + elapsedTime + 's! 88-key piano ready @ 20.00 TPS.');

  return {
    bytes,
    stats: {
      notes: totalHarpNotes,
      keys: uniqueKeys.size,
      dur: durationSec.toFixed(1),
      elapsed: elapsedTime,
      songName
    }
  };
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  try {
    const result = await runAutoConversion(curFile, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> Harp notes &middot; <strong>' + s.elapsed + 's</strong> processing<br>' +
      'Duration: <strong>' + s.dur + 's</strong> (1:1 Real-Time Speed @ 20.00 TPS)<br>' +
      'Pitch Range: <strong>' + s.keys + '/88</strong> full piano keys (A0 to C8)';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
