<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.35rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 36px 18px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 18px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.95rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: background 0.15s;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 14px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 100px;
  overflow-y: auto;
  margin-top: 10px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Continuous gapless 25-note vanilla Harp converter</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v2.6.0 (Gapless)</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

// Initialize GPU acceleration immediately
(async () => {
  try {
    if (window.tf) {
      await tf.setBackend('webgl');
      await tf.ready();
    }
  } catch (e) {}
})();

const NBS_HARP = 0; // 100% Vanilla Harp on dirt

const MIDI_LO = 54; // F#3
const MIDI_HI = 78; // F#5

function foldToVanillaRange(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

function calculateAutoBPM(noteEvents) {
  if (noteEvents.length < 4) return 120;

  const onsets = [...new Set(noteEvents.map(e => Math.round(e.startTimeSeconds * 1000)))].sort((a, b) => a - b);
  const iois = [];
  for (let i = 1; i < onsets.length; i++) {
    const diff = (onsets[i] - onsets[i - 1]) / 1000;
    if (diff > 0.06 && diff < 1.8) {
      iois.push(diff);
    }
  }

  if (iois.length < 3) return 120;

  iois.sort((a, b) => a - b);
  const medianIoi = iois[Math.floor(iois.length / 2)];
  let estimatedBpm = 60 / medianIoi;

  while (estimatedBpm < 70) estimatedBpm *= 2;
  while (estimatedBpm > 180) estimatedBpm /= 2;

  return Math.round(estimatedBpm);
}

function buildNbsBinary(tickNotes, songName, tps) {
  const tempo = Math.round(tps * 100);

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  i16(0);
  u8(5);
  u8(16);
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);
  u8(0);
  u8(10);
  u8(4);
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(NBS_HARP);
      u8(n.key);
      u8(n.vel);
      u8(100);
      i16(0);
      layer++;
    }
    i16(0);
  }
  i16(0);

  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);
    u8(100);
    u8(100);
  }

  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Gapless Continuous Note Processor:
// Ensures no melody dropouts, soft verses or transitional gaps are missed
function processGaplessNotes(noteEvents) {
  const sorted = [...noteEvents].sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);

  const bpm = calculateAutoBPM(sorted);
  const tps = (bpm / 60) * 4;

  const tickMap = new Map();

  for (const n of sorted) {
    const tick = Math.max(0, Math.round(n.startTimeSeconds * tps));
    const origMidi = Math.round(n.pitchMidi);
    const foldedMidi = foldToVanillaRange(origMidi);
    const nbsKey = foldedMidi - 21; // 33..57

    // Clear dynamic velocity (50..100)
    const vel = Math.round(Math.max(50, Math.min(100, 45 + n.amplitude * 60)));

    if (!tickMap.has(tick)) tickMap.set(tick, []);
    tickMap.get(tick).push({
      key: nbsKey,
      vel,
      amp: n.amplitude,
      origMidi
    });
  }

  // Preserve all musical notes without dropping quiet sections
  const cleanedTicks = new Map();

  for (const [tick, notes] of tickMap) {
    notes.sort((a, b) => b.amp - a.amp);

    const chosen = [];
    const usedKeys = new Set();

    for (const n of notes) {
      if (chosen.length >= 4) break; // Allow up to 4 simultaneous notes so harmonies aren't dropped
      if (usedKeys.has(n.key)) continue; // Deduplicate same pitch on same tick

      chosen.push(n);
      usedKeys.add(n.key);
    }

    if (chosen.length > 0) {
      cleanedTicks.set(tick, chosen);
    }
  }

  return { cleanedTicks, bpm, tps };
}

async function runAutoConversion(file, log, setProg) {
  const startTime = performance.now();
  log('Decoding ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio. Please ensure file is a valid MP3, WAV, MP4, or OGG.');
  }

  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration.toFixed(1);
  log('Audio loaded: ' + durationSec + 's.');
  setProg(15);

  if (window.tf) {
    try {
      await tf.setBackend('webgl');
      await tf.ready();
    } catch (e) {}
  }

  if (!basicPitchInstance) {
    log('Loading Pitch Neural Network...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Running AI Pitch Detection across full track...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 70));
    }
  );

  log('Extracting continuous gapless note stream...');
  setProg(88);

  // Sensitive thresholds to catch quiet verses and subtle notes (no dropped spaces)
  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    0.28,  // Lower onset threshold to capture quieter notes
    0.16,  // Lower frame threshold to keep sustained notes connected
    2,     // Shorter min note length (2 frames = ~23ms) so staccatos/triplets aren't dropped
    true,
    null,
    null,
    false  // Melodia trick off to prevent suppressing secondary melody lines
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  setProg(94);

  const { cleanedTicks, bpm, tps } = processGaplessNotes(noteEvents);

  let totalHarpNotes = 0;
  const uniqueKeys = new Set();
  for (const [t, list] of cleanedTicks) {
    totalHarpNotes += list.length;
    for (const n of list) uniqueKeys.add(n.key);
  }

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(cleanedTicks, songName, tps);
  setProg(100);

  const elapsedTime = ((performance.now() - startTime) / 1000).toFixed(1);
  log('Complete in ' + elapsedTime + 's! Extracted ' + totalHarpNotes + ' continuous notes.');

  return {
    bytes,
    stats: {
      notes: totalHarpNotes,
      keys: uniqueKeys.size,
      bpm,
      tps: tps.toFixed(2),
      dur: durationSec,
      elapsed: elapsedTime,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  try {
    const result = await runAutoConversion(curFile, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> continuous Harp notes &middot; <strong>' + s.elapsed + 's</strong><br>' +
      'Auto Tempo: <strong>' + s.bpm + ' BPM</strong> (' + s.tps + ' TPS) &middot; ' +
      '<strong>' + s.keys + '/25</strong> vanilla Harp keys';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
