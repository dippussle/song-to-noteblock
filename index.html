<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 40px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.35rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 36px 18px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 18px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.95rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.btn {
  width: 100%;
  padding: 12px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
  transition: background 0.15s;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 14px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 100px;
  overflow-y: auto;
  margin-top: 10px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">1:1 Real-time speed & continuous 25-note vanilla Harp music</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v3.0.0 (Real-Time 20TPS)</div>

<script type="module">
import { BasicPitch } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

// Initialize GPU acceleration immediately
(async () => {
  try {
    if (window.tf) {
      await tf.setBackend('webgl');
      await tf.ready();
    }
  } catch (e) {}
})();

const NBS_HARP = 0; // 100% Vanilla Harp on dirt

// Standard 20 TPS Minecraft clock (1 tick = 50ms = 0.050s)
const TPS = 20;

// Vanilla 25-note range: F#3 to F#5 (MIDI 54 to 78) -> NBS keys 33 to 57
const MIDI_LO = 54;
const MIDI_HI = 78;

function foldToVanillaRange(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

function buildNbsBinary(tickNotes, songName) {
  const tempo = TPS * 100; // Exact 2000 = 20.00 TPS

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS v5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // 2000 = exactly 20.00 TPS real-time
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(NBS_HARP);     // 100% Harp
      u8(n.key);        // Key (33..57 vanilla 25 notes)
      u8(n.vel);        // Velocity (0..100)
      u8(100);          // Center panning
      i16(0);           // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Frame-Level Real-Time Continuous Music Extraction
// Maps every frame directly to exact 20 TPS Minecraft ticks without gaps or slowdowns
function extractRealtimeHarpNotes(frames, onsets, totalSeconds) {
  // Basic Pitch frame step: hop size is 256 samples @ 22050 Hz = ~0.01161 seconds per AI frame
  const frameDurationSec = 256 / 22050; // ~11.6ms
  const totalTicks = Math.ceil(totalSeconds * TPS); // 20 ticks per second

  const tickNotes = new Map();
  let prevPlayedKeys = new Set();
  let lastKeyTriggerTick = new Map();

  for (let t = 0; t < totalTicks; t++) {
    const timeSec = t / TPS; // Exact second for this tick (0.00, 0.05, 0.10, 0.15...)
    const frameIndex = Math.min(frames.length - 1, Math.round(timeSec / frameDurationSec));

    if (frameIndex < 0 || frameIndex >= frames.length) continue;

    const frameProbs = frames[frameIndex];
    const onsetProbs = onsets[frameIndex];

    // Gather active candidate pitches at this moment
    const candidates = [];

    for (let p = 0; p < 88; p++) {
      const midi = p + 21; // MIDI note 21..108
      const frameVal = frameProbs[p];
      const onsetVal = onsetProbs ? onsetProbs[p] : 0;

      // Combined musical score: frame presence + onset attack
      const score = frameVal * 0.7 + onsetVal * 0.3;

      if (score >= 0.18) { // Sensitive threshold ensures no quiet notes or gaps are lost
        candidates.push({ midi, score, onset: onsetVal });
      }
    }

    if (!candidates.length) {
      prevPlayedKeys.clear();
      continue;
    }

    // Sort candidates by score descending
    candidates.sort((a, b) => b.score - a.score);

    const tickNotesList = [];
    const usedKeysInTick = new Set();

    for (const cand of candidates) {
      if (tickNotesList.length >= 3) break; // Keep up to 3 harmonious notes per tick

      const foldedMidi = foldToVanillaRange(cand.midi);
      const nbsKey = foldedMidi - 21; // 33..57

      if (usedKeysInTick.has(nbsKey)) continue;

      const lastTick = lastKeyTriggerTick.get(nbsKey) ?? -999;
      const isNewOnset = cand.onset > 0.25;

      // Trigger if: it's a new note onset, or at least 2 ticks have passed, or note wasn't in previous tick
      if (isNewOnset || t - lastTick >= 2 || !prevPlayedKeys.has(nbsKey)) {
        const vel = Math.round(Math.max(55, Math.min(100, 45 + cand.score * 60)));
        tickNotesList.push({ key: nbsKey, vel });
        usedKeysInTick.add(nbsKey);
        lastKeyTriggerTick.set(nbsKey, t);
      }
    }

    if (tickNotesList.length > 0) {
      tickNotes.set(t, tickNotesList);
      prevPlayedKeys = new Set(tickNotesList.map(n => n.key));
    } else {
      prevPlayedKeys.clear();
    }
  }

  return tickNotes;
}

async function runAutoConversion(file, log, setProg) {
  const startTime = performance.now();
  log('Decoding ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Unable to decode audio. Please ensure file is a valid MP3, WAV, MP4, or OGG.');
  }

  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration;
  log('Audio loaded: ' + durationSec.toFixed(1) + 's.');
  setProg(15);

  if (window.tf) {
    try {
      await tf.setBackend('webgl');
      await tf.ready();
    } catch (e) {}
  }

  if (!basicPitchInstance) {
    log('Loading AI Pitch Neural Network...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Running Full AI Neural Network...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 70));
    }
  );

  log('Mapping continuous real-time notes at 20.00 TPS (Zero slowdowns & zero gaps)...');
  setProg(88);

  const tickNotes = extractRealtimeHarpNotes(frames, onsets, durationSec);

  let totalHarpNotes = 0;
  const uniqueKeys = new Set();
  for (const [t, list] of tickNotes) {
    totalHarpNotes += list.length;
    for (const n of list) uniqueKeys.add(n.key);
  }

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(tickNotes, songName);
  setProg(100);

  const elapsedTime = ((performance.now() - startTime) / 1000).toFixed(1);
  log('Done in ' + elapsedTime + 's! Exactly 1:1 real-time speed (' + durationSec.toFixed(1) + 's audio).');

  return {
    bytes,
    stats: {
      notes: totalHarpNotes,
      keys: uniqueKeys.size,
      dur: durationSec.toFixed(1),
      elapsed: elapsedTime,
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  try {
    const result = await runAutoConversion(curFile, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> Harp notes &middot; <strong>' + s.elapsed + 's</strong> processing<br>' +
      'Exact Duration: <strong>' + s.dur + 's</strong> (1:1 Real-Time Speed @ 20.00 TPS)<br>' +
      '<strong>' + s.keys + '/25</strong> vanilla Harp keys used';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
