<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song to Note Block</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: #121212;
  color: #e0e0e0;
  padding: 30px 20px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 460px;
}
h1 {
  font-size: 1.3rem;
  font-weight: 600;
  color: #ffffff;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 0.85rem;
  color: #888888;
  margin-bottom: 24px;
}
.dropzone {
  border: 1px dashed #444444;
  border-radius: 6px;
  padding: 30px 15px;
  text-align: center;
  cursor: pointer;
  background: #1a1a1a;
  margin-bottom: 16px;
  transition: border-color 0.15s, background 0.15s;
}
.dropzone:hover, .dropzone.dragover {
  border-color: #888888;
  background: #222222;
}
.dropzone p {
  font-size: 0.9rem;
  color: #cccccc;
  margin-bottom: 4px;
}
.dropzone span {
  font-size: 0.75rem;
  color: #777777;
}
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.field {
  display: flex;
  flex-direction: column;
}
label {
  font-size: 0.75rem;
  color: #888888;
  margin-bottom: 4px;
}
input, select {
  background: #1a1a1a;
  border: 1px solid #333333;
  color: #ffffff;
  padding: 8px 10px;
  border-radius: 4px;
  font-size: 0.85rem;
  outline: none;
}
input:focus, select:focus {
  border-color: #666666;
}
.btn {
  width: 100%;
  padding: 10px;
  background: #2a2a2a;
  border: 1px solid #444444;
  color: #ffffff;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 4px;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:hover:not(:disabled) {
  background: #333333;
  border-color: #555555;
}
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.btn-dl {
  background: #1f3b25;
  border-color: #2e5938;
  display: none;
}
.btn-dl:hover {
  background: #274a2f;
}
.progress-bar {
  width: 100%;
  height: 4px;
  background: #222222;
  border-radius: 2px;
  overflow: hidden;
  margin: 12px 0;
  display: none;
}
.progress-fill {
  width: 0%;
  height: 100%;
  background: #ffffff;
  transition: width 0.15s;
}
.status {
  font-family: monospace;
  font-size: 0.75rem;
  color: #777777;
  max-height: 90px;
  overflow-y: auto;
  margin-top: 8px;
}
.stats {
  margin-top: 14px;
  padding: 12px;
  background: #181818;
  border: 1px solid #282828;
  border-radius: 4px;
  font-size: 0.8rem;
  color: #aaaaaa;
  line-height: 1.6;
  display: none;
}
.stats strong {
  color: #ffffff;
}
.version-tag {
  position: fixed;
  bottom: 12px;
  left: 14px;
  font-family: monospace;
  font-size: 0.72rem;
  color: #555555;
  user-select: none;
}
</style>
</head>
<body>

<div class="container">
  <h1>Song to Note Block</h1>
  <p class="subtitle">Convert audio into tight, punchy vanilla Harp note block music</p>

  <div class="dropzone" id="dropzone">
    <p id="fileLabel">Select or drop audio/video file</p>
    <span id="fileSub">MP3, WAV, MP4, OGG, M4A, FLAC</span>
    <input type="file" id="fileInput" accept=".mp3,.wav,.mp4,.ogg,.m4a,.flac,.aac" style="display:none">
  </div>

  <div class="grid">
    <div class="field">
      <label for="speedFactor">Speed & Energy</label>
      <select id="speedFactor">
        <option value="1.0" selected>Normal Speed (1.0x)</option>
        <option value="1.15">Brisk & Energetic (1.15x)</option>
        <option value="1.25">Fast Pace (1.25x)</option>
        <option value="1.5">High Speed (1.5x)</option>
      </select>
    </div>
    <div class="field">
      <label for="rhythmMode">Rhythm Tightness</label>
      <select id="rhythmMode">
        <option value="smooth" selected>Smooth & Anti-Lag (No Stutter)</option>
        <option value="sharp">Sharp & Staccato</option>
        <option value="raw">Raw Unfiltered</option>
      </select>
    </div>
    <div class="field">
      <label for="clarity">Melody Punch</label>
      <select id="clarity">
        <option value="punchy" selected>Punchy & Loud (Boosted)</option>
        <option value="natural">Natural Volume</option>
      </select>
    </div>
    <div class="field">
      <label for="polyphony">Max Notes at Once</label>
      <select id="polyphony">
        <option value="3" selected>Up to 3 Harp Notes (Clean)</option>
        <option value="2">2 Harp Notes (Lead + Bass)</option>
        <option value="1">1 Harp Note (Solo Melody)</option>
        <option value="25">Unlimited (All Notes)</option>
      </select>
    </div>
  </div>

  <button class="btn" id="convertBtn" disabled>Convert to .NBS</button>
  <button class="btn btn-dl" id="downloadBtn">Download .NBS</button>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="status" id="log"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="version-tag">v2.3.0</div>

<script type="module">
import { BasicPitch, outputToNotesPoly, noteFramesToTime } from 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/+esm';

const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@spotify/basic-pitch/model/model.json';
let basicPitchInstance = null;

const NBS_HARP = 0; // 100% Harp only

const MIDI_LO = 54; // F#3
const MIDI_HI = 78; // F#5

function foldToVanillaRange(midi) {
  let m = midi;
  while (m < MIDI_LO) m += 12;
  while (m > MIDI_HI) m -= 12;
  return Math.max(MIDI_LO, Math.min(MIDI_HI, m));
}

function buildNbsBinary(tickNotes, songName, tps) {
  const tempo = Math.round(tps * 100);

  const sortedTicks = [...tickNotes.keys()].sort((a, b) => a - b);
  if (!sortedTicks.length) {
    sortedTicks.push(0);
    tickNotes.set(0, [{ inst: NBS_HARP, key: 33, vel: 100 }]);
  }

  const songLen = sortedTicks[sortedTicks.length - 1];
  let maxLayers = 1;
  for (const t of sortedTicks) {
    const sz = tickNotes.get(t).length;
    if (sz > maxLayers) maxLayers = sz;
  }

  const parts = [];
  const u8  = v => { const b = new Uint8Array(1); b[0] = v & 0xFF; parts.push(b); };
  const i16 = v => { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, true); parts.push(b); };
  const i32 = v => { const b = new Uint8Array(4); new DataView(b.buffer).setInt32(0, v, true); parts.push(b); };
  const str = s => {
    const e = new TextEncoder().encode(s);
    i32(e.length);
    if (e.length > 0) parts.push(e);
  };

  // Header (NBS v5)
  i16(0);          // New-format flag
  u8(5);           // NBS version 5
  u8(16);          // 16 vanilla instruments
  i16(songLen);
  i16(maxLayers);
  str(songName);
  str("Song to NoteBlock");
  str("");
  str("");
  i16(tempo);      // TPS * 100
  u8(0);           // auto-save off
  u8(10);          // auto-save duration
  u8(4);           // time signature 4/4
  i32(0); i32(0); i32(0); i32(0); i32(0);
  str("");
  u8(0); u8(0); i16(0);

  // Notes section - ALL NOTES ARE HARP (inst: 0)
  let prevTick = -1;
  for (const tick of sortedTicks) {
    i16(tick - prevTick);
    prevTick = tick;

    const noteList = tickNotes.get(tick);
    let layer = 0;
    let prevLayer = -1;
    for (const n of noteList) {
      i16(layer - prevLayer);
      prevLayer = layer;
      u8(NBS_HARP);     // 100% Harp only
      u8(n.key);        // Key (33..57 vanilla 25 notes)
      u8(n.vel);        // Velocity (0..100)
      u8(100);          // Center panning
      i16(0);           // Pitch bend
      layer++;
    }
    i16(0);
  }
  i16(0);

  // Layers section
  for (let i = 0; i < maxLayers; i++) {
    str("Layer " + (i + 1));
    u8(0);   // lock = false
    u8(100); // volume
    u8(100); // panning
  }

  // Custom instruments count (0)
  u8(0);

  const total = parts.reduce((s, p) => s + p.length, 0);
  const out   = new Uint8Array(total);
  let off = 0;
  for (const p of parts) { out.set(p, off); off += p.length; }
  return out;
}

// Anti-Stutter & Rhythm Tightening Pipeline
function processCleanRhythm(noteEvents, polyphonyLimit, tps, speedFactor, rhythmMode, clarity) {
  // Sort notes by start time
  const sorted = [...noteEvents].sort((a, b) => a.startTimeSeconds - b.startTimeSeconds);

  // 1. Merge micro-stutters: if the exact same note starts within 70ms of previous note end, merge it
  const mergedNotes = [];
  for (const n of sorted) {
    const prev = mergedNotes[mergedNotes.length - 1];
    if (prev && prev.pitchMidi === n.pitchMidi && (n.startTimeSeconds - (prev.startTimeSeconds + prev.durationSeconds) < 0.07)) {
      // Extend previous note duration instead of stutter-hitting
      prev.durationSeconds = (n.startTimeSeconds + n.durationSeconds) - prev.startTimeSeconds;
      prev.amplitude = Math.max(prev.amplitude, n.amplitude);
    } else {
      mergedNotes.push({ ...n });
    }
  }

  // 2. Map into smooth ticks
  const tickMap = new Map();

  for (const n of mergedNotes) {
    // Apply speed factor to compress time (makes playback faster/tighter)
    const adjustedTime = n.startTimeSeconds / speedFactor;
    const tick = Math.max(0, Math.round(adjustedTime * tps));

    const origMidi = Math.round(n.pitchMidi);
    const foldedMidi = foldToVanillaRange(origMidi);
    const nbsKey = foldedMidi - 21; // 33..57

    // Punchy velocity boosting for clear audibility
    let vel = Math.round(n.amplitude * 125);
    if (clarity === 'punchy') {
      vel = Math.max(55, Math.min(100, Math.round(50 + n.amplitude * 55))); // Boosted 55-100 range
    } else {
      vel = Math.max(30, Math.min(100, vel));
    }

    if (!tickMap.has(tick)) tickMap.set(tick, []);
    tickMap.get(tick).push({
      key: nbsKey,
      vel,
      amp: n.amplitude,
      origMidi
    });
  }

  // 3. Clean and de-clutter each tick
  const cleanedTicks = new Map();
  let lastKeyTick = new Map();

  for (const [tick, notes] of tickMap) {
    // Sort by amplitude descending (loudest main melody first)
    notes.sort((a, b) => b.amp - a.amp);

    const chosen = [];
    const usedKeys = new Set();

    for (const n of notes) {
      if (chosen.length >= polyphonyLimit) break;
      if (usedKeys.has(n.key)) continue;

      if (rhythmMode === 'smooth') {
        // Prevent machine-gun jitter of the exact same key within 1 tick
        const prevT = lastKeyTick.get(n.key) ?? -999;
        if (tick - prevT < 2 && n.amp < 0.6) continue;
      }

      chosen.push(n);
      usedKeys.add(n.key);
      lastKeyTick.set(n.key, tick);
    }

    if (chosen.length > 0) {
      cleanedTicks.set(tick, chosen);
    }
  }

  return cleanedTicks;
}

async function runConversion(file, opts, log, setProg) {
  log('Loading ' + file.name + '...');
  setProg(5);

  const arrBuf = await file.arrayBuffer();
  const actx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
  let decoded;
  try {
    decoded = await actx.decodeAudioData(arrBuf);
  } catch (e) {
    throw new Error('Could not decode audio. Please ensure file is an MP3, WAV, MP4, or OGG.');
  }

  // Downmix to mono AudioBuffer
  const monoBuffer = actx.createBuffer(1, decoded.length, 22050);
  const monoChannel = monoBuffer.getChannelData(0);
  const numChannels = decoded.numberOfChannels;

  for (let i = 0; i < decoded.length; i++) {
    let sum = 0;
    for (let ch = 0; ch < numChannels; ch++) {
      sum += decoded.getChannelData(ch)[i];
    }
    monoChannel[i] = sum / numChannels;
  }
  await actx.close();

  const durationSec = monoBuffer.duration.toFixed(1);
  log('Audio loaded: ' + durationSec + 's.');
  setProg(15);

  if (!basicPitchInstance) {
    log('Loading Spotify AI Pitch Model...');
    basicPitchInstance = new BasicPitch(MODEL_URL);
  }

  log('Running AI Transcription...');
  const frames = [];
  const onsets = [];
  const contours = [];

  await basicPitchInstance.evaluateModel(
    monoBuffer,
    (f, o, c) => {
      frames.push(...f);
      onsets.push(...o);
      contours.push(...c);
    },
    (percent) => {
      setProg(15 + Math.round(percent * 65));
    }
  );

  log('Tightening rhythm & melody lines...');
  setProg(85);

  // Optimized thresholds for tight melody capture
  const rawNoteEvents = outputToNotesPoly(
    frames,
    onsets,
    0.38,  // onsetThresh
    0.22,  // frameThresh
    3,     // minNoteLen
    true,
    null,
    null,
    true   // melodiaTrick for extracting clean lead melody
  );

  const noteEvents = noteFramesToTime(rawNoteEvents);
  log('Transcribed ' + noteEvents.length + ' melodic notes.');
  setProg(92);

  const tps = 20; // 20 TPS base clock
  const speedFactor = parseFloat(opts.speedFactor) || 1.0;
  const polyphonyLimit = parseInt(opts.polyphony) || 3;

  const harpTicks = processCleanRhythm(
    noteEvents,
    polyphonyLimit,
    tps,
    speedFactor,
    opts.rhythmMode,
    opts.clarity
  );

  let totalHarpNotes = 0;
  const uniqueKeys = new Set();
  for (const [t, list] of harpTicks) {
    totalHarpNotes += list.length;
    for (const n of list) uniqueKeys.add(n.key);
  }

  log('Smoothed into ' + totalHarpNotes + ' punchy notes at ' + speedFactor + 'x speed.');
  setProg(96);

  const songName = (file.name.replace(/\.[^.]+$/, '')).slice(0, 64);
  const bytes = buildNbsBinary(harpTicks, songName, tps);
  setProg(100);
  log('Ready to download!');

  return {
    bytes,
    stats: {
      notes: totalHarpNotes,
      keys: uniqueKeys.size,
      speed: speedFactor + 'x',
      dur: (durationSec / speedFactor).toFixed(1),
      songName
    }
  };
}

let curFile = null, dlBlob = null, dlName = 'song.nbs';

const dropzone    = document.getElementById('dropzone');
const fileInput   = document.getElementById('fileInput');
const convertBtn  = document.getElementById('convertBtn');
const downloadBtn = document.getElementById('downloadBtn');
const progressBar = document.getElementById('progressBar');
const progressFill= document.getElementById('progressFill');
const logEl       = document.getElementById('log');
const statsEl     = document.getElementById('stats');

function setFile(f) {
  if (!f) return;
  curFile = f;
  document.getElementById('fileLabel').textContent = f.name;
  document.getElementById('fileSub').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
  convertBtn.disabled = false;
}

dropzone.addEventListener('click',     ()  => fileInput.click());
fileInput.addEventListener('change',   e   => setFile(e.target.files[0]));
dropzone.addEventListener('dragover',  e   => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', ()  => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop',      e   => { e.preventDefault(); dropzone.classList.remove('dragover'); setFile(e.dataTransfer.files[0]); });

function addLog(msg) {
  const d = document.createElement('div');
  d.textContent = '> ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

convertBtn.addEventListener('click', async () => {
  if (!curFile) return;
  convertBtn.disabled = true;
  downloadBtn.style.display = 'none';
  progressBar.style.display = 'block';
  statsEl.style.display = 'none';
  progressFill.style.width = '0%';
  logEl.innerHTML = '';

  const opts = {
    speedFactor: document.getElementById('speedFactor').value,
    rhythmMode:  document.getElementById('rhythmMode').value,
    clarity:     document.getElementById('clarity').value,
    polyphony:   document.getElementById('polyphony').value,
  };

  try {
    const result = await runConversion(curFile, opts, addLog, p => { progressFill.style.width = p + '%'; });
    const s = result.stats;
    dlBlob = new Blob([result.bytes], { type: 'application/octet-stream' });
    dlName = s.songName.replace(/[^\w\- ]/g, '_').trim() + '.nbs';
    downloadBtn.style.display = 'block';
    statsEl.innerHTML =
      '<strong>' + s.notes + '</strong> punchy Harp notes &middot; ' +
      'Speed: <strong>' + s.speed + '</strong><br>' +
      'Effective Duration: <strong>' + s.dur + 's</strong> &middot; ' +
      '<strong>' + s.keys + '/25</strong> vanilla Harp notes';
    statsEl.style.display = 'block';
  } catch (e) {
    addLog('Error: ' + e.message);
  }
  convertBtn.disabled = false;
});

downloadBtn.addEventListener('click', () => {
  if (!dlBlob) return;
  const url = URL.createObjectURL(dlBlob);
  const a = document.createElement('a');
  a.href = url; a.download = dlName; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
